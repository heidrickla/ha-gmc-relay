name: GMC Relay
version: "0.5.1"
slug: gmc_relay
description: Receive a GQ GMC Geiger counter's WiFi upload on port 80, hand it to Home Assistant, forward it to gmcmap.com
url: https://github.com/heidrickla/ha-gmc-relay
arch:
  - amd64
  - aarch64
startup: services
init: false
services:
  - mqtt:want
ports:
  80/tcp: 80
ports_description:
  80/tcp: Where the counter uploads. GQ counters only speak to port 80.
ingress: true
panel_icon: mdi:radioactive
panel_title: GMC Relay
map:
  - type: addon_config
    read_only: false
options:
  counter_ids: []
  forward: true
schema:
  counter_ids:
    - str
  forward: bool
  forward_url: url?
  webhook_id: password?
  core_url: url?
  core_verify_tls: bool?
  log_level: list(debug|info|warning|error)?
