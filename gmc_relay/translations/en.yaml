configuration:
  counter_ids:
    name: Counter ids
    description: The GID values to accept. Leave empty and the first counter to upload is accepted.
  forward:
    name: Forward to gmcmap
    description: Replay each upload to gmcmap.com so the public map keeps updating.
  forward_url:
    name: Forward URL
    description: Where uploads are replayed. Default https://www.gmcmap.com.
  webhook_id:
    name: Webhook id
    description: Only for a template sensor fed by a webhook. Set, the readings go to this webhook instead of MQTT discovery.
  core_url:
    name: Home Assistant URL
    description: Where the webhook is posted, as the app reaches Home Assistant. Default https://homeassistant:8123.
  core_verify_tls:
    name: Verify Home Assistant's certificate
    description: Check the certificate on an https URL, against core-ca.pem in the app's config folder when it is there, else the system store. Default on.
  log_level:
    name: Log level
    description: Default info; debug logs every request.
network:
  80/tcp: Where the counter uploads. GQ counters only speak to port 80.
