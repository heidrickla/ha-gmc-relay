name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The personal forge's runner also reads .github/workflows; these jobs run on GitHub only.
jobs:
  lint:
    name: Lint
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install --quiet "ruff==0.15.21" "yamllint==1.35.1" "shellcheck-py==0.10.0.1"
      - name: ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: yamllint
        run: >-
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}, comments: {min-spaces-from-content: 1}}}"
          repository.yaml gmc_relay/config.yaml gmc_relay/translations/en.yaml
          .github/workflows/ci.yml .gitea/workflows/validate.yml .gitea/workflows/image.yml
      - name: shellcheck
        run: shellcheck gmc_relay/run.sh
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: gmc_relay/Dockerfile
          failure-threshold: info
      - name: App linter
        uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./gmc_relay

  test:
    name: Test
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install --quiet "pytest==9.0.3"
      - name: pytest
        run: python -m pytest

  build:
    name: Build ${{ matrix.arch }}
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build
        run: >-
          docker buildx build --load --platform ${{ matrix.platform }}
          --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION=ci
          -t gmc-relay:${{ matrix.arch }} gmc_relay
      # The image runs with no option set: the watchdog endpoint answers, the first counter to
      # upload is adopted and another refused, and the ingress listener refuses a non-gateway address.
      - name: Run
        run: |
          mkdir -p data
          echo '{"counter_ids": [], "forward": true, "forward_url": "http://127.0.0.1:9"}' > data/options.json
          # /data is writable as the Supervisor mounts it: the relay keeps history.db there
          docker run -d --name relay --platform ${{ matrix.platform }} -v "$PWD/data:/data" \
            -e SUPERVISOR_TOKEN=ci-token -p 18080:80 -p 18099:8099 gmc-relay:${{ matrix.arch }}
          check() { "$@" || { echo "failed: $*"; docker logs relay; exit 1; }; }
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:18080/healthz && break; sleep 1; done
          check test "$(curl -s http://127.0.0.1:18080/healthz)" = "ok"
          check test "$(curl -s 'http://127.0.0.1:18080/log2.asp?AID=1&GID=2&CPM=21')" = "OK.ERR0."
          check test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18080/log2.asp?AID=1&GID=3&CPM=21')" = "403"
          check test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18099/)" = "403"
          check test -f data/counters.json
          # The relay process holds the Supervisor token it finds the MQTT broker with.
          check docker exec relay sh -c 'tr "\0" "\n" < /proc/$(pgrep -x python3)/environ | grep -qx SUPERVISOR_TOKEN=ci-token'
          docker logs relay
